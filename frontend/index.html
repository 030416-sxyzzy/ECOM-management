<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>商品管理</title>
  <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css" />
  <style>
    body { padding: 24px; }
    .toolbar { margin-bottom: 16px; display: flex; gap: 8px; align-items: center; }
    .image-cell img { width: 60px; height: 60px; object-fit: cover; border-radius: 4px; }
  </style>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://unpkg.com/element-plus"></script>
  <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
  <script>
    const api = axios.create({ baseURL: 'http://localhost:8080' });
  </script>
</head>
<body>
  <div id="app"></div>

  <script>
    const { createApp, ref, reactive, onMounted } = Vue;

    const App = {
      setup() {
        const categories = ref([]);
        const tableData = ref([]);
        const total = ref(0);
        const loading = ref(false);
        const page = ref(1);
        const size = ref(10);
        const filters = reactive({ keyword: '', categoryId: null, status: '' });

        const dialogVisible = ref(false);
        const editing = ref(false);
        const form = reactive({ id: null, name: '', description: '', price: 0, stock: 0, categoryId: null, imageUrl: '', status: 'active' });

        const loadCategories = async () => {
          const res = await api.get('/api/categories');
          categories.value = res.data;
        };

        const loadData = async () => {
          loading.value = true;
          try {
            const res = await api.get('/api/products', {
              params: { keyword: filters.keyword, categoryId: filters.categoryId, status: filters.status, page: page.value, size: size.value }
            });
            tableData.value = res.data.records || [];
            total.value = res.data.total || 0;
          } finally {
            loading.value = false;
          }
        };

        const resetForm = () => {
          Object.assign(form, { id: null, name: '', description: '', price: 0, stock: 0, categoryId: null, imageUrl: '', status: 'active' });
        };

        const onCreate = () => {
          editing.value = false;
          resetForm();
          dialogVisible.value = true;
        };

        const onEdit = (row) => {
          editing.value = true;
          Object.assign(form, row);
          dialogVisible.value = true;
        };

        const onDelete = async (row) => {
          await api.delete(`/api/products/${row.id}`);
          ElMessage.success('删除成功');
          loadData();
        };

        const onSubmit = async () => {
          if (editing.value) {
            await api.put(`/api/products/${form.id}`, form);
            ElMessage.success('更新成功');
          } else {
            await api.post('/api/products', form);
            ElMessage.success('创建成功');
          }
          dialogVisible.value = false;
          loadData();
        };

        onMounted(() => {
          loadCategories();
          loadData();
        });

        return { categories, tableData, total, loading, page, size, filters, dialogVisible, editing, form, loadData, onCreate, onEdit, onDelete, onSubmit };
      },
      template: `
        <div>
          <div class="toolbar">
            <el-input v-model="filters.keyword" placeholder="搜索商品名称" clearable style="width: 220px" @keyup.enter.native="loadData" />
            <el-select v-model="filters.categoryId" placeholder="分类" clearable style="width: 160px">
              <el-option v-for="c in categories" :key="c.id" :label="c.name" :value="c.id" />
            </el-select>
            <el-select v-model="filters.status" placeholder="状态" clearable style="width: 140px">
              <el-option label="上架" value="active" />
              <el-option label="下架" value="inactive" />
            </el-select>
            <el-button type="primary" @click="loadData">查询</el-button>
            <el-button type="success" @click="onCreate">新增商品</el-button>
          </div>

          <el-table :data="tableData" v-loading="loading" border>
            <el-table-column label="图片" width="90">
              <template #default="{ row }">
                <div class="image-cell">
                  <img :src="row.imageUrl || 'https://via.placeholder.com/60'" alt="img" />
                </div>
              </template>
            </el-table-column>
            <el-table-column prop="name" label="名称" min-width="160" />
            <el-table-column prop="price" label="价格" width="100" />
            <el-table-column prop="stock" label="库存" width="90" />
            <el-table-column prop="status" label="状态" width="100">
              <template #default="{ row }">
                <el-tag :type="row.status === 'active' ? 'success' : 'info'">{{ row.status === 'active' ? '上架' : '下架' }}</el-tag>
              </template>
            </el-table-column>
            <el-table-column label="操作" width="180">
              <template #default="{ row }">
                <el-button size="small" @click="onEdit(row)">编辑</el-button>
                <el-button size="small" type="danger" @click="onDelete(row)">删除</el-button>
              </template>
            </el-table-column>
          </el-table>

          <div style="margin-top: 12px; display: flex; justify-content: flex-end;">
            <el-pagination background layout="prev, pager, next, jumper, ->, total" :total="total" :page-size="size" v-model:current-page="page" @current-change="loadData" />
          </div>

          <el-dialog v-model="dialogVisible" :title="editing ? '编辑商品' : '新增商品'" width="600">
            <el-form label-width="90px">
              <el-form-item label="名称"><el-input v-model="form.name" /></el-form-item>
              <el-form-item label="描述"><el-input v-model="form.description" type="textarea" /></el-form-item>
              <el-form-item label="分类">
                <el-select v-model="form.categoryId" placeholder="选择分类" style="width: 100%">
                  <el-option v-for="c in categories" :key="c.id" :label="c.name" :value="c.id" />
                </el-select>
              </el-form-item>
              <el-form-item label="价格"><el-input v-model.number="form.price" type="number" min="0" /></el-form-item>
              <el-form-item label="库存"><el-input v-model.number="form.stock" type="number" min="0" /></el-form-item>
              <el-form-item label="图片URL"><el-input v-model="form.imageUrl" /></el-form-item>
              <el-form-item label="状态">
                <el-select v-model="form.status" style="width: 100%">
                  <el-option label="上架" value="active" />
                  <el-option label="下架" value="inactive" />
                </el-select>
              </el-form-item>
            </el-form>
            <template #footer>
              <el-button @click="dialogVisible = false">取消</el-button>
              <el-button type="primary" @click="onSubmit">保存</el-button>
            </template>
          </el-dialog>
        </div>
      `,
    };

    createApp(App).use(ElementPlus).mount('#app');
  </script>
</body>
</html>
